[project]
name = "gp-thee"
version = "0.1.0"
description = "A GPT trained from scratch on nothing but the complete works of Shakespeare. An educational project."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Shivam Tiwari" }
]
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub>=1.32.0",
    "numpy>=2.5.3",
    "safetensors>=0.8.0",
    "torch==2.14.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Use uv's own CPython, not Homebrew's, so a Homebrew upgrade cannot break the environment.
python-preference = "only-managed"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "slow: a test that refits the n-gram baselines on 4.8 million characters (about a minute)",
]
